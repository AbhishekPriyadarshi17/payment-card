<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .Container {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px;
            background-color: #22C1C3;

        }

        .card {
            width: 400px;
            height: 600px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-starts;
            align-items: center;
            border-radius: 20px;
            gap: 25px;
        }

        .card img {
            width: 100%;
            height: 30%;
            display: block;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            /* border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            flex-direction: column; */


        }

        .card p {
            padding: 0 20px;
        }

        .textbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            text-align: center;
        }

        #AmountBox {
            width: 80%;
            height: 10%;
            background-color: rgba(16, 2, 66, 0.589);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 20px;
            padding-left: 20px;
            max-width: 330px;



        }

        .leftbox {
            width: fit-content;
            display: flex;
            gap: 15px;
            height: 100%;
            align-items: center;

        }

        .leftbox img {
            height: 3.5rem;
            width: 3.5rem;

        }

        .rightbox {}



        #PaymentButton {
            width: 80%;
            height: 9%;
            border-radius: 10px;
            background-color: rgb(4, 4, 56);
            color: aliceblue;
            flex-direction: column;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;

        }

        .cancelBox a {
            text-decoration: none;
            color: rgb(59, 56, 56);
            font-weight: bold;
            font-size: large;

        }


        @media (max-width: 480px) {
            .Container {
                padding: 10px;
            }

            .card {
                min-height: auto;
                gap: 18px;
            }

            .card img {
                height: 160px;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .card p {
                font-size: 0.9rem;
            }

            #AmountBox,
            #PaymentButton {
                width: 95%;
            }

            .leftbox img {
                width: 3rem;
                height: 3rem;
            }
        }
    </style>
</head>

<body>
    <div class="Container">
        <div class="card">
            <img src="payment.jpg" />

            <div class="textbox">
                <h2>Order Summary</h2>

                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio autem iusto nam. Distinctio
                    dolorem
                    expedita quae provident ipsa a reprehenderit!</p>


            </div>

            <div id="AmountBox">

                <div class="leftbox">
                    <div class="imgbox">
                        <img src="muiscc.jpeg" alt="music">
                    </div>


                    <div class="TextAmountBox">
                        <p>Amount</p>
                        <p>$99.9/year</p>
                    </div>

                </div>
                <div class="rightbox">
                    <a href="#">Change</a>
                </div>

            </div>

            <button id="PaymentButton">Proceed to Payment</button>

            <div class="cancelBox">
                <a href="#">Cancel Order</a>
            </div>


        </div>


    </div>

</body>

</html>
